name: condaScanpy
channels:
  - conda-forge
  - defaults

dependencies:
  # ---- Core ----
  - python=3.9
  - pip

  # ---- Jupyter ----
  - jupyterlab=3.3.4
  - jupyter_server=1.15.6
  - ipykernel
  - notebook
  - nbconvert
  - nbformat

  # ---- Scientific stack ----
  - numpy=1.22.3
  - scipy=1.8.1
  - pandas=2.0.2
  - scikit-learn=1.2.2
  - statsmodels=0.14.0
  - numba=0.57.1
  - llvmlite=0.40.1

  # ---- Plotting ----
  - matplotlib=3.7.1
  - seaborn=0.12.2

  # ---- Scanpy ecosystem ----
  - scanpy=1.9.3
  - anndata=0.9.1
  - umap-learn=0.5.3
  - pynndescent=0.5.10
  - louvain=0.7.0
  - bbknn=1.6.0

  # ---- TCR / immune ----
  - scirpy=0.13.0
  - airr=1.4.1
  - python-igraph=0.10.4
  - igraph=0.10.4
  - rapidfuzz=2.15.1
  - levenshtein=0.21.1

  # ---- MuData ----
  - mudata=0.2.3
  - muon=0.1.6

  # ---- IO / misc ----
  - h5py=3.9.0
  - tqdm
  - joblib
  - pyyaml
  - natsort

  # ---- Networking (CRÍTICO) ----
  - requests=2.31.0
  - urllib3=1.26.18
  - charset-normalizer=2.1.1

  # ---- pip-only packages ----
  - pip:
      - awkward==2.2.4
      - awkward-cpp==17
      - session-info==1.0.0
      - squarify==0.4.3
      - yamlordereddictloader==0.4.0
